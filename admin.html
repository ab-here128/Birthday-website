<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
    h2 { color: #ff69b4; margin-bottom: 20px; }
    .visit-card { background: #1e1e1e; padding: 15px; margin-bottom: 12px; border-radius: 10px; border-left: 4px solid #ff69b4; }
    p { margin: 4px 0; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h2>🔒 Secret Visitor Analytics</h2>
  <div id="logs">Loading visits data...</div>

  <script>
    const DB_URL = "https://birthday-website-fe53a-default-rtdb.firebaseio.com";

    async function loadVisits() {
      const logsDiv = document.getElementById('logs');
      try {
        const response = await fetch(`${DB_URL}/visits.json`);
        const data = await response.json();

        if (!data) {
          logsDiv.innerHTML = "<p>Abhi tak kisi ne website open nahi ki.</p>";
          return;
        }

        logsDiv.innerHTML = "";
        Object.keys(data).reverse().forEach(key => {
          const item = data[key];
          logsDiv.innerHTML += `
            <div class="visit-card">
              <p><strong>⏰ Date & Time:</strong> ${item.time}</p>
              <p><strong>📱 Device:</strong> ${item.device}</p>
              <p><strong>🌐 Browser:</strong> ${item.browser}</p>
              <p><strong>📍 Location:</strong> ${item.city}, ${item.country}</p>
            </div>
          `;
        });
      } catch (e) {
        logsDiv.innerHTML = "<p>Error loading data. Check Firebase URL.</p>";
      }
    }

    loadVisits();
  </script>
</body>
</html>
